[[feature]]
id = "ssh-bootstrap-reuses-a-byte-identical"
title = "SSH bootstrap reuses a byte-identical image seed, else uploads the embedded amd64 initializer and publishes the pinned identity"
behavior = "SSH bootstrap reuses a byte-identical image seed, else uploads the embedded amd64 initializer and publishes the pinned identity: sshLeaseBackend.Acquire/Resolve call backend.prepareSSH, which runs the SSH initialization over the authenticated Kubernetes exec channel. The first exec is `uname -m`; openSSHInitializer accepts only \"x86_64\"/\"amd64\" and otherwise returns \"agent-sandbox-ssh static runtime does not support architecture %q; only amd64 (x86_64) is supported\" before anything is uploaded. The next exec probes the optional seed /opt/crabbox-seed/initialize with a shell snippet that only sha256sums it (never executes it) and prints \"CRABBOX_SEED_UNAVAILABLE\" when the file is absent, non-executable or sha256sum is unavailable. The seed is used only when the probe's two fields equal {digest of the decompressed embedded initializer, /opt/crabbox-seed/initialize}; any other outcome uploads the embedded initializer (umask 077, exclusive mkdir) to /tmp/crabbox-init-<16 random bytes hex>/initialize, chmod 700, invokes it and removes that path/dir afterwards. Actual exec/transport failures are hard errors, never seed absence. The selected initializer is invoked with JSON on stdin (leas"
why = {text = "inferred from the fork's commits: feat: add independent Agent Sandbox SSH runtime and streaming workflows; fix: reuse verified SSH seeds and honor remote utility paths", source = "inferred"}
decision = "keep"
evidence = {commits = ["5bb14c54a79c7473d897d739100257690ee780c6", "a271f7874ab7d0e3a1d0b69cb306e2e4b23824d1"], patch_ids = ["b60060587a18692acfb589cec13e46b60c8c67b4", "ef1d9d8bcca0c4f6e65b95836daac9012291682f"], paths = ["TestInitializeSSHRejectsUnsupportedArchitectureBeforeUpload", "TestInitializeSSHSeedSelection", "TestPrepareSSHPublishesPinnedIdentityAndFailsClosed", "TestSSHSeedProbeReadsExecutableWithoutRunningIt", "internal/providers/agentsandbox/ssh_bootstrap.go", "internal/providers/agentsandbox/ssh_runtime_assets.go"]}
