[[feature]]
id = "ssh-transport-runs-kubectl-port-forward"
title = "SSH transport runs kubectl port-forward behind an `__provider-ssh-proxy` stdio command"
behavior = "SSH transport runs kubectl port-forward behind an `__provider-ssh-proxy` stdio command: The SSH transport for an agent-sandbox-ssh lease is a kubectl port-forward plus an OpenSSH stdio proxy. backend.sshTarget builds the SSHTarget from the claim's pinned labels: it rejects a port outside 1024..65535 (must be canonical decimal), an invalid user, a host key that is not a lone authorized key, or a missing per-lease private key, with messages ending \"prepare the lease again\"; it sets Host to the lease ID, HostKeyAlias to the lease ID, KnownHostsFile to known_hosts beside the key, and ProxyCommand to the quoted argv of the current executable as `__provider-ssh-proxy agent-sandbox-ssh <lease-id> --agent-sandbox-kubectl=... --agent-sandbox-kubeconfig=... --agent-sandbox-context=... --agent-sandbox-namespace=... --agent-sandbox-warm-pool=... --agent-sandbox-container=... --agent-sandbox-workdir=...` with \"%\" doubled in every argument so OpenSSH does not expand tokens; a missing UID label disables the control master. backend.forwardSSH runs `kubectl [--kubeconfig=...] --context=... --namespace=... port-forward --address=127.0.0.1 pod/<pod> :<remotePort>`, parses the forwarded loopback port "
why = {text = "inferred from the fork's commits: feat: add independent Agent Sandbox SSH runtime and streaming workflows", source = "inferred"}
decision = "keep"
evidence = {commits = ["a271f7874ab7d0e3a1d0b69cb306e2e4b23824d1"], patch_ids = ["ef1d9d8bcca0c4f6e65b95836daac9012291682f"], paths = ["TestParseSSHForwardPortOnlyAcceptsLoopbackSSHMapping", "TestProviderSSHProxyDispatchesRawStreamsDirectly", "TestProviderSSHProxyRejectsMalformedInvocationBeforeConfigure", "TestSSHForwardOutputBoundsLinesAndHandlesFragments", "TestSSHTargetPinsHostKeyAndQuotesLiteralProxyArguments", "internal/cli/app.go", "internal/cli/provider_backend.go", "internal/cli/provider_ssh_proxy.go", "internal/providers/agentsandbox/ssh_transport.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L22)"

[[feature]]
id = "posix-ssh-sync-scripts-are-uploaded-to-a"
title = "POSIX SSH sync scripts are uploaded to a guarded private staging directory and cleaned up by ownership token (+3)"
behavior = "POSIX SSH sync scripts are uploaded to a guarded private staging directory and cleaned up by ownership token: Generated POSIX SSH sync/ownership scripts are no longer embedded in the SSH exec request. runSSHSyncScriptInputTarget prepares the workspace-owner witness, creates a random 16-byte hex name and a 32-byte hex ownership token, stages the source in /tmp/crabbox-sync-script-<name> via remoteUploadSyncScript (set -eu, umask 077, exclusive mkdir, owner token written with set -C, source read from stdin into <dir>/script, HUP/INT/TERM traps), then executes `/bin/sh <dir>/script` with the caller's input on stdin through prepareSSHTransport, and always runs remoteCleanupSyncScript in a 15-second detached context: it exits 0 when the directory is absent, refuses (exit 1) when the path is a symlink, not a directory, the owner file is a symlink or missing, or the token differs, and otherwise removes script, owner and the directory without recursion. The script's exit code, stdout and stderr are preserved; a failed upload returns before execution and before reading the input; cleanup errors are joined to the result; a cancellation cause is joined too. Since 5bb14c54a79c the scripts call"
why = {text = "inferred from the fork's commits: feat: add independent Agent Sandbox SSH runtime and streaming workflows; fix: preserve retained sandbox runtime and sync diagnostics; fix: reuse verified SSH seeds and honor remote utility paths", source = "inferred"}
decision = "keep"
