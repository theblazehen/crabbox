[[feature]]
id = "sandbox-initializer-reuses-a-verified"
title = "Sandbox initializer reuses a verified pre-extracted runtime and preserves existing tool and helper aliases"
behavior = "Sandbox initializer reuses a verified pre-extracted runtime and preserves existing tool and helper aliases: runtimes/agent-sandbox/main.go is the initializer executed inside the sandbox container. installRuntime now prefers, in order: an already-installed immutable runtime reachable through the private helper aliases (/usr/libexec/crabbox-sftp-server -> <root>/bin/sftp-server, /usr/libexec/crabbox-git-core -> <root>/libexec/git-core), verified with unpackRuntime(root, true); then a sibling `payload` directory beside the symlink-resolved initializer executable, which must pass secureSeedDirectory (absolute, real directory, root-owned, no group/world write, except /nix/store which may be root-owned sticky group-writable) and full payload verification, failing closed on unsafe/incomplete/mismatched content; otherwise a content-addressed /opt/crabbox-runtime/<payload-sha256> staged as before. installTools adds only missing /bin and /usr/bin symlinks (reusing compatible image tools) and rejects any existing tool or helper path that conflicts with the runtime, comparing helper aliases by symlink-resolved target so identical bytes at a different path are accepted. The daemon runs as Dropb"
why = {text = "inferred from the fork's commits: feat: add independent Agent Sandbox SSH runtime and streaming workflows; fix: preserve retained sandbox runtime and sync diagnostics; fix: reuse verified SSH seeds and honor remote utility paths", source = "inferred"}
decision = "keep"
