[[feature]]
id = "pod-container-runtime-ids-are-decoded"
title = "Track each sandbox container's runtime identity and recover SSH after replacement"
behavior = "Pod container runtime IDs are decoded per selected container name: podStateFromObject reads status.containerStatuses and records each container's containerID in podState.ContainerIDs keyed by the container name (blank names skipped). newSandboxReadiness sets sandboxReadiness.ContainerID to pod.ContainerIDs[selectedContainer], so the runtime identity belongs to the container the lease actually selects: the pod's kubectl.kubernetes.io/default-container annotation when no container is pinned, or the pinned container name when one is. A pod whose status carries no containerStatuses yields an empty ContainerID.; Readiness revalidation fences a replaced container runtime: revalidateSandboxReadiness compares the re-read pod's selected container runtime ID with the admitted readiness. A changed ID, including the runtime disappearing, fails with containerRuntimeChangedError carrying core.Exit(4, \"agent-sandbox pod %s container %s runtime changed from %s to %s\", pod, container, expected, core.Blank(current, \"<empty>\")). An empty expected ID (nothing admitted yet) is not fenced. A pod UID replacement keeps failing as resourceIdentityError, which stays distinct from the new runtime-changed err"
why = {text = "inferred from the fork's commits: fix: recover agent sandbox SSH after container replacement", source = "inferred"}
decision = "keep"
evidence = {commits = ["5b1eca3c08fe27db128363fc110ad5137e4398ba"], patch_ids = ["ea2404d2ca326f5e407d576fd6769728b8209eeb"], paths = ["TestPodRuntimeIDsDecodeBySelectedContainerName", "TestPrepareSSHRepairsIncompleteEndpointThroughKubernetes", "TestPrepareSSHRetriesOnlyAuthenticatedRuntimeReplacement", "TestSSHProxyRejectsIdentityChangesBeforeAndAfterForwarding", "TestSSHReadOnlyHealthRequiresPinnedAuthenticatedEndpoint", "TestSandboxReadinessRevalidatesSelectedContainerRuntime", "internal/providers/agentsandbox/core.go", "internal/providers/agentsandbox/kubernetes.go", "internal/providers/agentsandbox/ssh_backend.go", "internal/providers/agentsandbox/ssh_bootstrap.go", "internal/providers/agentsandbox/ssh_transport.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L1, L2, L3, L4, L5, L7, L8)"

[[feature]]
id = "runtime-initializer-request-accepts-only"
title = "Initialize sandbox SSH from authenticated lease credentials and recover container restarts safely"
behavior = "Runtime initializer request accepts only the lease ID and client public key: The agent-sandbox runtime initializer's JSON request now carries only lease_id and public_key. decodeRequest decodes fields individually and rejects any other field name with \"unknown initialization field %q\", so the former expected_host_key and expected_port fields are refused rather than honoured; duplicate keys, non-string values, trailing JSON, an invalid lease_id and a non-canonical public_key are still rejected.; Runtime initializer reuses a healthy endpoint and re-bootstraps missing container state: The initializer owns only its own daemon state under /var/lib/crabbox-ssh/<lease>: a healthy live daemon with a valid persisted port is verified and its endpoint returned unchanged; a stored PID with no port state is refused as ambiguous recovery (\"daemon PID exists without its port state; refusing ambiguous recovery\") without publishing an endpoint or replacing the live daemon PID; when the persisted host key/port/PID state is gone (container restart), a new host private key and a fresh free loopback port are generated. Another lease's SSH listener and unrelated accounts/tools are preserved."
why = {text = "inferred from the fork's commits: fix: recover agent sandbox SSH after container replacement", source = "inferred"}
decision = "keep"
evidence = {commits = ["5b1eca3c08fe27db128363fc110ad5137e4398ba"], patch_ids = ["ea2404d2ca326f5e407d576fd6769728b8209eeb"], paths = ["TestDecodeRequest", "runtimes/agent-sandbox/main.go", "scripts/test-agent-sandbox-runtime.py"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L12, L14)"

[[feature]]
id = "retained-agent-sandbox-ssh-resolve"
title = "Reuse retained SSH sessions safely while enforcing lease identity, expiry, and owner cleanup"
behavior = "Retained agent-sandbox-ssh resolve reuses a healthy identity-fenced endpoint without re-running the initializer: In internal/providers/agentsandbox/ssh_backend.go, sshLeaseBackend.Resolve calls reusePreparedSSH before prepare: it validates the recorded claim/Sandbox/pod/container runtime identity (validateSSHRuntime) and runs a pinned, client-key-authenticated SSH probe (lifecycle.probeSSH). On success it returns the lease built from the claim (sshLeaseFromClaim + lifecycle.sshTarget + core.PrepareLeaseSSHTrust + SetServerLeaseClaimSnapshot) without uploading or invoking the initializer. On any failure (identity mismatch, failed probe, sshTarget error, trust error) it returns false and Resolve falls through to the authenticated Kubernetes recovery path (b.prepare). The fast path is guarded by `!readOnly && !req.Reclaim`, where readOnly = req.StatusOnly || req.NoLocalStateMutations || req.ReleaseOnly. The reused target enables multiplexing: ControlScope is non-empty and NoControlMaster is false (internal/providers/agentsandbox/ssh_transport.go sshTarget).; Lease-scoped, identity-fenced persistent SSH control masters: Commit 815a9f135ab8 replaces the run-scoped master with a lease-sc"
why = {text = "inferred from the fork's commits: perf(agent-sandbox): retain identity-fenced SSH sessions across runs; perf: speed up retained Agent Sandbox SSH runs", source = "inferred"}
decision = "keep"
evidence = {commits = ["0d0e9a1e7fb299deac1bb22af4fe3266f3b1ca6e", "815a9f135ab88fc80a9ec7fde826493237cf585f"], patch_ids = ["47ede254b4a2988e98ef51aab42191b31a257d30", "f6f936fc5d99083524b3cfb484b2a5968a5124ba"], paths = ["TestPersistentSSHControlMasterLifecycle", "TestRetainedNoSyncPreparationFailureDoesNotStartWorkload", "TestRetainedNoSyncRunRequiresConfirmedOwnerRelease", "TestSSHControlScopeIsolatesRuntimeAndEndpoint", "TestSSHReadOnlyHealthRequiresPinnedAuthenticatedEndpoint", "TestSSHRunActivityRejectsChangedTransportBeforeKubernetes", "internal/cli/run.go", "internal/cli/ssh.go", "internal/cli/ssh_control_unix.go", "internal/cli/workspace_owner.go", "internal/providers/agentsandbox/ssh_backend.go", "internal/providers/agentsandbox/ssh_bootstrap.go", "internal/providers/agentsandbox/ssh_transport.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L6, L9, L11, L13, L15, L17, L18)"

[[feature]]
id = "endpoint-claim-refresh-skips-the-write"
title = "Endpoint claim refresh skips the write when nothing changed"
behavior = "Endpoint claim refresh skips the write when nothing changed: internal/cli/claim_transaction.go transactLeaseClaim gains a skipUnchanged flag: after tx.mutate, when tx.skipUnchanged && exists, it restores original.Revision, compares the mutated claim with the original via reflect.DeepEqual, and if unchanged returns the original claim without writing (so the revision and the ownership snapshot are preserved). internal/cli/claim.go updateLeaseClaimEndpointIfUnchangedMode sets skipUnchanged: true on its leaseClaimTransaction, keeping guard endpointClaimGuard(unchangedLeaseClaimGuard(...)), revision claimRevisionBeforeMutation, directory claimDirectoryCreate, publication claimSkipEmpty. Test TestClaimEndpointRefreshPreservesRevisionOnlyWhenUnchanged: first refresh returns a claim; a second refresh with the same server/target returns a claim deep-equal to the first; changing target.Port to \"2222\" yields SSHPort 2222 and a different Revision; reusing the stale `first` snapshot afterwards errors."
why = {text = "inferred from the fork's commits: perf(agent-sandbox): retain identity-fenced SSH sessions across runs", source = "inferred"}
decision = "keep"
evidence = {commits = ["815a9f135ab88fc80a9ec7fde826493237cf585f"], patch_ids = ["47ede254b4a2988e98ef51aab42191b31a257d30"], paths = ["TestClaimEndpointRefreshPreservesRevisionOnlyWhenUnchanged", "internal/cli/claim.go", "internal/cli/claim_transaction.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L16)"

[[feature]]
id = "ssh-forward-survives-transient"
title = "SSH forward survives transient revalidation errors and cancels only on identity change or expiry"
behavior = "SSH forward survives transient revalidation errors and cancels only on identity change or expiry: The SSH forward's periodic lease revalidation no longer cancels on any error. monitorSSHForwardIdentity cancels only when sshForwardRevalidationFatal reports proof of a changed runtime (resourceIdentityError, containerRuntimeChangedError) or lease expiry (sshLeaseExpiredError); every other error, including Kubernetes API timeouts, context deadline errors, errNotReady gaps and network errors, is logged once to stderr only when CRABBOX_DEBUG is 1/true/yes/on and retried on the next tick. The ticker interval is sshForwardRevalidateInterval (1 minute)."
why = {text = "inferred from the fork's commits: fix(agent-sandbox-ssh): keep forwards alive through transient revalidation errors", source = "inferred"}
decision = "keep"
evidence = {commits = ["0acae03668e9b2572e7c61d92a1f2608905990b9"], patch_ids = ["3d7fddad82e815279a9de816bab52a5a46426730"], paths = ["TestSSHForwardMonitorCancelsOnlyOnIdentityChange", "internal/providers/agentsandbox/ssh_transport.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L10)"

[[feature]]
id = "live-terminal-stdin-stays-attached-to"
title = "Live terminal stdin stays attached to the witnessed workload instead of being staged until EOF"
behavior = "Live terminal stdin stays attached to the witnessed workload instead of being staged until EOF: internal/cli/workspace_owner.go prepareWorkspaceOwnerRemote (commit 814133d9): stageInput := inputSize != nil && *inputSize >= 0, and the POSIX command becomes owner.wrapPOSIXCommand(remote, stageInput, marker). Previously any non-nil inputSize staged the input, so a live terminal (size -1) blocked on EOF before the command ran. Finite script/payload input keeps the guarded non-replay staging (cat >\"$run_dir/input\" then <\"$run_dir/input\"). Test TestSSHWorkspaceOwnerLiveStdinDoesNotRequireEOF runs two cases through a workspace-owner-aware fake ssh: a command that ignores stdin (\"printf 'done\\\\n'\" → \"done\\n\") and one that reads a line (\"IFS= read -r line; printf '%s\\\\n' \\\"$line\\\"\" with input \"one line\\n\" → \"one line\\n\")."
why = {text = "inferred from the fork's commits: fix(ssh): keep live terminal stdin attached to workloads", source = "inferred"}
decision = "keep"
evidence = {commits = ["814133d9077d72f24c389188055a1f9014ec7403"], patch_ids = ["b634724174086d5c47028326bc43b41fed232c3e"], paths = ["TestSSHWorkspaceOwnerLiveStdinDoesNotRequireEOF", "internal/cli/workspace_owner.go", "internal/cli/workspace_owner_test.go"]}
notes = "found by RepoSteward run repo-20261117T181350Z-b4fd (its obligations L19)"

[[feature]]
id = "agent-sandbox-ssh-is-a-separate-ssh"
title = "agent-sandbox-ssh is a separate SSH-lease provider sharing the agent-sandbox config namespace (+1)"
behavior = "agent-sandbox-ssh is a separate SSH-lease provider sharing the agent-sandbox config namespace: A second provider `agent-sandbox-ssh` is registered next to `agent-sandbox` from the same package (both in init()). Its spec: family \"agent-sandbox\", Kind SSHLease, Targets linux only, Features ssh + crabbox-sync + cleanup + run-session, Coordinator never, no aliases, class disposition unmapped. Configuring it with a non-linux target fails as exit 2 with \"provider=agent-sandbox-ssh supports target=linux only\". Both providers register and apply the same `--agent-sandbox-*` flag namespace (kubectl, kubeconfig, context, namespace, warm-pool, container, workdir, sandbox-ready-timeout, pod-ready-timeout, exec-timeout-secs, forget-missing, delete-on-release), and the first registrant wires the shared storage while both ApplyFlags read the same parsed values and mark delete-on-release explicit for the selected provider. Claim identity stays separate: the SSH variant's claims carry provider label \"agent-sandbox-ssh\" and a provider scope that appends \"|provider:agent-sandbox-ssh\", so the archive provider neither authorizes nor resolves them (and vice versa). The SSH variant rejects fixed lease IDs"
why = {text = "inferred from the fork's commits: feat: add independent Agent Sandbox SSH runtime and streaming workflows", source = "inferred"}
decision = "keep"
evidence = {commits = ["a271f7874ab7d0e3a1d0b69cb306e2e4b23824d1"], patch_ids = ["ef1d9d8bcca0c4f6e65b95836daac9012291682f"], paths = ["TestProvidersShareParsedAgentSandboxFlags", "TestSSHAcquireRollbackFailurePreservesRecoveryClaim", "TestSSHDoctorRequiresPortForwardRBAC", "TestSSHProviderKeepsSeparateScopeAndExecutionContract", "TestSSHReleaseDeleteFailureIsNotTerminal", "TestSSHReleaseMessageDescribesRetention", "TestSSHReleaseRejectsReclaimedRepository", "TestSSHReleaseReportsTerminalDespiteLocalFinalizationFailure", "TestSSHReleaseRetentionDoesNotDeleteOrClaimTerminalOutcome", "internal/providers/agentsandbox/backend.go", "internal/providers/agentsandbox/claim.go", "internal/providers/agentsandbox/flags.go", "internal/providers/agentsandbox/provider.go", "internal/providers/agentsandbox/ssh_backend.go"]}
